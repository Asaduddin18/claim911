name: claim911-isolation
services:
  probe:
    build:
      context: .
      dockerfile: Dockerfile.probe
    user: "65532:65532"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    restart: "no"
    # No host mounts, ports, credentials, devices or Docker socket.
